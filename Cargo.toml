[package]
name = "apicker"
version = "0.3.1"
edition = "2021"
description = "A fast, scriptable file picker backend in Rust"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
fuzzy-matcher = "0.3.7"
dirs = "5.0"
toml = "0.8"
rayon = "1.12.0"
